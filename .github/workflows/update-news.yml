name: Update news headlines

on:
  schedule:
    # Every 3 hours, at 23 minutes past the hour (UTC), every day
    - cron: "23 */3 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect headlines from news feeds
        run: python scripts/update_news.py

      - name: Commit headlines if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No new headlines."
          else
            git commit -m "Update news headlines"
            git pull --rebase
            git push
          fi
